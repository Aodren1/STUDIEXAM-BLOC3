# ----------------------------------------------------------------------------------------------
# Profil BIG DATA — la chaîne cible complète, à petite échelle (poste ou VM ≥ 12 Go de RAM).
#
#   sources SQLite simulées ─► extraction (rôle Talend, conteneur abf-ingestion-extract)
#        └─ en cible : Oracle + SQL Server ─► Kafka Connect / Debezium (CDC) ou Talend Remote Engine
#   ─► Kafka (topics src.<ab|ap>.<entité>, 3 partitions)
#   ─► Spark (jobs silver, doublons, gold soumis par abf-traitement-submit)
#   ─► HDFS (/datalake/fusion/{bronze,silver,gold})
#   ─► tableau de bord (Flask) et Superset (exploration libre)
#
# Nomenclature des Blocs 1 et 2 : abf-<couche>-<composant>.
# Démarrage :   docker compose -f infra/docker-compose.bigdata.yml up -d
#               docker compose -f infra/docker-compose.bigdata.yml run --rm abf-ingestion-extract
#               docker compose -f infra/docker-compose.bigdata.yml run --rm abf-traitement-submit
# ----------------------------------------------------------------------------------------------
name: abf-bigdata

x-fusion-env: &fusion-env
  FUSION_BUS: kafka
  KAFKA_BOOTSTRAP: abf-flux-kafka:9092
  FUSION_LAKE: webhdfs
  WEBHDFS_URL: http://abf-stockage-namenode:9870
  HDFS_USER: fusion
  HDFS_ROOT: /datalake/fusion
  FUSION_REF_DATE: "2026-10-31"

services:
  # ---------------------------------------------------------------- flux : Kafka (KRaft, sans ZooKeeper)
  abf-flux-kafka:
    image: apache/kafka:3.9.0
    hostname: abf-flux-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://abf-flux-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@abf-flux-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics créés explicitement (kafka/create-topics.sh)
      KAFKA_LOG_RETENTION_HOURS: 168             # 7 jours de rejouabilité
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 12

  abf-flux-topics:
    image: apache/kafka:3.9.0
    depends_on:
      abf-flux-kafka: { condition: service_healthy }
    volumes: ["./kafka/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/create-topics.sh", "abf-flux-kafka:9092"]
    restart: "no"

  # Capture de changements (CDC) en cible : Debezium lit les journaux Oracle (LogMiner) et SQL Server (CDC)
  # et publie sur les mêmes topics src.* (connecteurs dans ./connect). Non démarré sans bases réelles.
  abf-flux-connect:
    image: quay.io/debezium/connect:2.7
    profiles: ["cdc"]
    depends_on: [abf-flux-kafka]
    environment:
      BOOTSTRAP_SERVERS: abf-flux-kafka:9092
      GROUP_ID: abf-connect
      CONFIG_STORAGE_TOPIC: _abf_connect_configs
      OFFSET_STORAGE_TOPIC: _abf_connect_offsets
      STATUS_STORAGE_TOPIC: _abf_connect_status
    volumes: ["./connect:/kafka/connectors-config:ro"]
    ports: ["8083:8083"]

  # ---------------------------------------------------------------- stockage : HDFS
  abf-stockage-namenode:
    image: apache/hadoop:3.4.1
    hostname: abf-stockage-namenode
    command: ["hdfs", "namenode"]
    env_file: ["./hadoop/config"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports: ["9870:9870"]

  abf-stockage-datanode:
    image: apache/hadoop:3.4.1
    hostname: abf-stockage-datanode
    command: ["hdfs", "datanode"]
    env_file: ["./hadoop/config"]
    depends_on: [abf-stockage-namenode]

  # ---------------------------------------------------------------- traitement : Spark
  abf-traitement-spark-master:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "7077:7077"]

  abf-traitement-spark-worker:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://abf-traitement-spark-master:7077
    depends_on: [abf-traitement-spark-master]
    environment:
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: "2"

  # Soumet les trois jobs (silver → doublons → gold) ; le paquet fusion est distribué aux exécuteurs.
  abf-traitement-submit:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    profiles: ["jobs"]
    depends_on: [abf-traitement-spark-master, abf-flux-kafka, abf-stockage-namenode]
    volumes: ["../:/opt/fusion:ro"]
    working_dir: /opt/fusion
    entrypoint: ["/bin/bash", "infra/spark/submit-all.sh"]

  # ---------------------------------------------------------------- ingestion (rôle Talend) et restitution
  abf-ingestion-extract:
    build: ..
    profiles: ["jobs"]
    environment: *fusion-env
    entrypoint: ["python", "-m", "fusion"]
    command: ["run"]
    volumes: ["fusion-data:/data"]
    depends_on: [abf-flux-topics, abf-stockage-datanode]

  abf-restitution-dashboard:
    build: ..
    environment:
      <<: *fusion-env
      FUSION_ADMIN_PASSWORD: ${FUSION_ADMIN_PASSWORD:?définir dans .env}
      FUSION_USER_PASSWORD: ${FUSION_USER_PASSWORD:?définir dans .env}
    volumes: ["fusion-data:/data"]
    ports: ["8096:8000"]
    depends_on: [abf-flux-kafka, abf-stockage-namenode]

  abf-restitution-superset:
    image: apache/superset:4.0.2
    profiles: ["exploration"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?définir dans .env}
    ports: ["8088:8088"]

volumes:
  fusion-data:
