# Analyse SonarCloud (job « sonarcloud » de la CI ; authentification OIDC sans secret, sonarqube-auth-action).
sonar.projectKey=Aodren1_STUDIEXAM-BLOC3
sonar.organization=aodren1
sonar.projectName=fusion-data — AbAssurance × AssurePlus
sonar.sourceEncoding=UTF-8

# Périmètre : SonarCloud analyse tout le dépôt (sonar.sources et sonar.tests n'ont plus d'effet, les tests
# sont détectés automatiquement). Exclus : bibliothèques tierces embarquées et outillage du dossier d'examen.
sonar.exclusions=fusion/web/static/vendor/**,docs/**
sonar.python.version=3.11,3.12,3.13

# couverture et résultats de tests produits par pytest (artefact « couverture »)
sonar.python.coverage.reportPaths=coverage.xml
# périmètre de la couverture = celui de pytest-cov (paquet fusion, hors __main__) ; les jobs Spark sont
# vérifiés par le job CI « spark », le JavaScript par node --test (sans rapport lcov), les scripts par la CI
sonar.coverage.exclusions=jobs/**,scripts/**,fusion/__main__.py,fusion/web/static/**
sonar.python.xunit.reportPath=junit.xml

# alertes des analyseurs externes importées comme problèmes Sonar
sonar.python.ruff.reportPaths=ruff.json
sonar.python.bandit.reportPaths=bandit.json

# Quality Gate « Sonar way » : sur le nouveau code, couverture ≥ 80 %, duplication ≤ 3 %,
# aucune vulnérabilité, notes A en fiabilité, sécurité et maintenabilité.
sonar.qualitygate.wait=false
