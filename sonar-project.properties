# Analyse SonarCloud (job « sonarcloud » de la CI ; jeton dans le secret SONAR_TOKEN du dépôt GitHub).
sonar.projectKey=Aodren1_STUDIEXAM-BLOC3
sonar.organization=aodren1
sonar.projectName=fusion-data — AbAssurance × AssurePlus
sonar.sourceEncoding=UTF-8

sonar.sources=fusion,jobs,scripts
sonar.tests=tests
sonar.exclusions=fusion/web/static/vendor/**
sonar.python.version=3.11,3.12,3.13

# couverture et résultats de tests produits par pytest (artefact « couverture »)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# alertes des analyseurs externes importées comme problèmes Sonar
sonar.python.ruff.reportPaths=ruff.json
sonar.python.bandit.reportPaths=bandit.json

# Quality Gate « Sonar way » : sur le nouveau code, couverture ≥ 80 %, duplication ≤ 3 %,
# aucune vulnérabilité, notes A en fiabilité, sécurité et maintenabilité.
sonar.qualitygate.wait=false
