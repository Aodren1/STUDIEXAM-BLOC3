# Contrôles exécutés avant chaque commit (pip install pre-commit && pre-commit install).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, fusion]
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]
  - repo: local
    hooks:
      - id: convention-branche
        name: convention de nommage de la branche
        entry: python scripts/check_branch_name.py
        language: system
        pass_filenames: false
        always_run: true
